
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>画像識別アプリ</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 750px;">
            <div class="card-body p-4">

                <h1 class="text-center mb-4">画像識別アプリ</h1>

                <!-- 画像アップロードフォーム -->
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_image" class="form-label">
                            画像を選択してください
                        </label>
                        <input
                            type="file"
                            name="image"
                            accept="image/*"
                            class="form-control"
                            id="id_image"
                            required
                        >
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-4">
                            画像を判定する
                        </button>
                    </div>
                </form>

                <!-- 選択した画像のプレビュー -->
                <div class="text-center mt-4">
                    <img
                        id="preview"
                        src="{{ image_url|default:'' }}"
                        class="img-fluid rounded shadow-sm"
                        style="max-height: 350px; {% if not image_url %}display: none;{% endif %}"
                        alt="アップロード画像"
                    >
                </div>

                <!-- 判定結果 -->
                {% if results %}
                    <hr class="my-4">

                    <h2 class="h4 text-center mb-3">
                        判定結果（上位5件）
                    </h2>

                    <div class="table-responsive">
                        <table class="table table-striped table-bordered text-center align-middle">
                            <thead class="table-primary">
                                <tr>
                                    <th>分類名</th>
                                    <th>確率</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for class_id, label, score in results %}
                                <tr>
                                    <td>{{ label }}</td>
                                    <td>{{ score|floatformat:4 }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                {% endif %}

            </div>
        </div>
    </div>

    <!-- 画像プレビュー用JavaScript -->
    <script>
        const imageInput = document.getElementById('id_image');
        const preview = document.getElementById('preview');

        imageInput.addEventListener('change', function(event) {
            const file = event.target.files[0];

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
            }
        });
    </script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
